[project]
name = "proyecto-iagen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "PabloMR-84", email = "pablitoalpoder@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "dotenv>=0.9.9",
    "ipykernel>=7.4.0",
    "ipython>=9.18.1",
    "ipywidgets>=8.1.9",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.0",
    "langchain-google-genai>=4.4.2",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.18",
    "pypdf>=6.21.3",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
proyecto-iagen = "proyecto_iagen:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
